name: probe-prices
on:
  push:
    branches: [probe-prices]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: mkdir out && cd out && node ../probe/dump.mjs && ls -la
      - run: |
          cd out
          git init -q && git checkout -q -b probe-prices-out
          git config user.email probe@example.invalid && git config user.name probe
          git add . && git commit -qm sonde
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" probe-prices-out
