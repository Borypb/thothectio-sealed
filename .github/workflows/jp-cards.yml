name: Cartes japonaises officielles

# Cartes Pokémon japonaises de pokemon-card.com pour les extensions absentes de TCGdex.
# Les pages de détail ne sont lues qu'une fois par carte (cache) : la première passe est longue,
# les suivantes ne traitent que les nouvelles cartes.
on:
  schedule:
    # avant l'index du scan (4 h 30 UTC)
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      max:
        description: "Pages de détail au maximum pour cette passe"
        required: false
        default: "25000"

permissions:
  contents: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  jp:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/jp-cards.mjs
        env:
          JP_MAX_DETAILS: ${{ github.event.inputs.max || '6000' }}
      - name: Publier si quelque chose a changé
        run: |
          git config user.name "catalogue-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A cards/pokemon-ja
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Cartes japonaises officielles : mise à jour $(date -u +%F)"
            for essai in 1 2 3; do
              git fetch --depth=50 origin main
              if git rebase -X theirs origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 15
            done
            exit 1
          fi
