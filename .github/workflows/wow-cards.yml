name: Cartes World of Warcraft (wowcards.info, wowtcgfr.com)

# Liste des cartes du World of Warcraft TCG publiée par wowcards.info (créé par Richard Kämmerer, maintenu par
# Xavier, avec son accord) et cartes françaises de wowtcgfr.com (créé et maintenu par Aeron, avec son accord).
# Lecture lente (une page toutes les 1,5 s, environ 130 + 7 pages), une fois par mois :
# le jeu est arrêté depuis 2013, le site n'ajoute que des corrections. La fusion avec le catalogue TCGplayer se
# fait chaque nuit (update.yml, scripts/wow-merge.mjs) ; une nouvelle liste relance aussitôt le catalogue.
on:
  schedule:
    # le 3 de chaque mois, avant le catalogue de la nuit (3 h 50 UTC)
    - cron: "10 1 3 * *"
  workflow_dispatch:
    inputs:
      sites:
        description: "Sites à relire"
        type: choice
        options: [tous, wowcards.info, wowtcgfr.com]
        default: tous

permissions:
  contents: write
  actions: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  wow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: wowcards.info
        if: github.event_name == 'schedule' || inputs.sites != 'wowtcgfr.com'
        run: node scripts/wow-cards.mjs
      - name: wowtcgfr.com
        if: github.event_name == 'schedule' || inputs.sites != 'wowcards.info'
        run: node scripts/wow-fr.mjs
      - name: Publier si quelque chose a changé
        id: publish
        run: |
          git config user.name "catalogue-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/wow-wowcards.json cards/wow-wowtcgfr.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
            exit 0
          fi
          git commit -m "Cartes World of Warcraft (wowcards.info, wowtcgfr.com) : mise à jour $(date -u +%F)"
          for essai in 1 2 3; do
            git fetch --depth=50 origin main
            if git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "changed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          exit 1
      # un commit du robot ne déclenche pas les autres workflows : le catalogue est relancé explicitement
      - name: Relancer le catalogue
        if: steps.publish.outputs.changed == '1'
        run: gh workflow run update.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
