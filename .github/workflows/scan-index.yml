name: Index du scan à l'image

# Empreintes visuelles des cartes (scan en ligne de Thothectio), publiées sur la branche « scan ».
# Incrémental : seules les nouvelles images sont traitées. La première fois, toutes les cartes ne
# tiennent pas dans une passe : l'index se complète au fil des nuits (les plus récentes d'abord).
on:
  schedule:
    # après la mise à jour du catalogue (3 h 50 UTC)
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      games:
        description: "Licences ou fichiers à traiter (ex. « pokemon-fr,lorcana »), vide = tout"
        required: false
        default: ""
      budget:
        description: "Temps maximal de calcul, en minutes"
        required: false
        default: "300"

permissions:
  contents: write

concurrency:
  group: scan-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Index précédent (branche scan)
        run: git clone --depth 1 --branch scan "https://github.com/${{ github.repository }}.git" scan-out || mkdir -p scan-out
      - name: Décodeur d'images
        run: npm install --no-save --no-package-lock --no-audit --no-fund sharp@0.34.4
      - name: Empreintes
        run: node --max-old-space-size=6144 scripts/scan-index.mjs
        env:
          SCAN_OUT: scan-out
          SCAN_GAMES: ${{ inputs.games }}
          SCAN_BUDGET_MIN: ${{ inputs.budget || '300' }}
      - name: Publier (une seule version, sans historique)
        working-directory: scan-out
        run: |
          rm -rf .git
          git init -q -b scan
          git config user.name "catalogue-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 1. les données ; 2. index.json qui pointe vers ce commit : l'app lit les données
          #    sur jsDelivr à cette adresse immuable (cache CDN permanent), et index.json frais sur GitHub
          mv index.json ../index.json.new
          git add -A
          git commit -qm "Index du scan $(date -u +%F) : données"
          DATA=$(git rev-parse HEAD)
          node -e 'const fs=require("fs");const i=JSON.parse(fs.readFileSync("../index.json.new","utf8"));i.commit=process.argv[1];fs.writeFileSync("index.json",JSON.stringify(i,null,1)+"\n")' "$DATA"
          git add index.json
          git commit -qm "Index du scan $(date -u +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" scan
