name: Cartes officielles (Digimon, Dragon Ball)

# Cartes des sites officiels Bandai : Digimon en japonais (digimoncard.com), Dragon Ball Fusion World en
# japonais (dbs-cardgame.com/fw). Le catalogue TCGplayer n'a que l'anglais.
on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalogue
  cancel-in-progress: false

jobs:
  digimon-ja:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/digimon-ja.mjs
      - run: node scripts/fw-langs.mjs
      - name: Publier si quelque chose a changé
        run: |
          git config user.name "catalogue-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A cards/digimon-ja cards/dragonball-ja
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Cartes officielles : mise à jour $(date -u +%F)"
            for essai in 1 2 3; do
              git fetch --depth=50 origin main
              if git rebase -X theirs origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 15
            done
            exit 1
          fi
